# The "knarf mic": PipeWire's WebRTC noise suppression in front of the real mic (from hektor).
# knarf points its input at the mic it picks and records the cleaned-up output. Installed by
# `just audio-setup` into ~/.config/pipewire/pipewire.conf.d/; your default mic and output don't change.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            audio.channels = 1
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.transient_suppression = true   # keyboard clicks
                webrtc.voice_detection = false
                webrtc.gain_control = false           # keep levels steady for the speech threshold
            }
            capture.props = {
                node.name = "knarf_ec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "knarf_mic"
                node.description = "knarf mic"
                priority.session = 0                  # never the default source
                priority.driver = 0
            }
            sink.props = {
                node.name = "knarf_speaker"
                node.description = "knarf speaker"
                priority.session = 0                  # never the default output
                priority.driver = 0
            }
            playback.props = {
                node.name = "knarf_ec_playback"
                node.passive = true
            }
        }
    }
]
